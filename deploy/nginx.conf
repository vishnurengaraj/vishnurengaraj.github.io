# Raspberry Pi behind a Cloudflare Tunnel.
# cloudflared forwards hostnames to http://127.0.0.1:80. This server matches on Host.
# TLS stays at Cloudflare.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/rengaraj
#   sudo ln -sf /etc/nginx/sites-available/rengaraj /etc/nginx/sites-enabled/rengaraj
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:80;
    server_name rengaraj.com www.rengaraj.com;

    return 301 https://vishnu.rengaraj.com$request_uri;
}

server {
    listen 127.0.0.1:80;
    server_name vishnu.rengaraj.com;

    root /var/www/rengaraj;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Flat SSG files: /about is dist/about.html. History routes fall back to index.html.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Personal diner shots are replaced in place. A new filename in
    # src/data/diners.js is what busts Safari; this keeps the next swap
    # from sticking for a month. Other /media/ stays at 30d.
    location /media/diners/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
