# Deploys the static site to the rengaraj Worker (workers.dev only).
# wrangler.jsonc has no routes and no custom domains, so this does not
# change vishnu.rengaraj.com, rengaraj.com, www, or wedding.rengaraj.com.
name: Workers

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is unset. Skipping deploy."
            echo "Production DNS is unchanged. Add the token to publish the rengaraj Worker to workers.dev."
            exit 0
          fi
          npm run deploy
